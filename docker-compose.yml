# ═══════════════════════════════════════════════════════════════════
#  IERS — Intelligent Emergency Response System
#  Master Docker Compose — Full Stack (including ML Service)
#
#  JUST RUN:  docker compose up --build
#
#  PORT MAP:
#    8761  — Eureka Dashboard        http://localhost:8761
#    8080  — API Gateway             http://localhost:8080
#    8081  — Auth Service
#    8082  — IoT Service
#    8083  — Dispatch Service
#    8000  — ML Service (Swagger)    http://localhost:8000/docs
#    5432  — PostgreSQL + PostGIS
#    6379  — Redis
#    9094  — Kafka (external access)
#    3000  — React Frontend          http://localhost:3000
# ═══════════════════════════════════════════════════════════════════

services:

  # ─────────────────────── INFRASTRUCTURE ───────────────────────

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: iers-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iers_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - iers-network

  redis:
    image: redis:7-alpine
    container_name: iers-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-iers_redis_2026} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-iers_redis_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - iers-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: iers-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "4L622nShTUiBenVKWSTATUS"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - iers-network

  # ─────────────────────── SERVICE DISCOVERY ───────────────────────

  eureka-server:
    build: ./iers-eureka-server
    container_name: iers-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iers-network

  # ─────────────────────── ML SERVICE (Python) ───────────────────────

  ml-service:
    build: ./iers-ml-service
    container_name: iers-ml
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - iers-network

  # ─────────────────────── APPLICATION SERVICES ───────────────────────

  api-gateway:
    build: ./iers-api-gateway
    container_name: iers-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-iers-jwt-secret-key-that-is-at-least-32-characters-long-2026}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-iers-device-key-2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-iers_redis_2026}
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - iers-network

  auth-service:
    build: ./iers-auth-service
    container_name: iers-auth
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET:-iers-jwt-secret-key-that-is-at-least-32-characters-long-2026}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iers_auth
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-iers_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-iers_redis_2026}
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - iers-network

  iot-telemetry-service:
    build: ./iers-iot-service
    container_name: iers-iot
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iers_iot
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-iers_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-iers_redis_2026}
      KAFKA_BOOTSTRAP: kafka:9092
      ML_SERVICE_URL: http://ml-service:8000
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - iers-network

  dispatch-notification-service:
    build: ./iers-dispatch-service
    container_name: iers-dispatch
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iers_dispatch
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-iers_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-iers_redis_2026}
      KAFKA_BOOTSTRAP: kafka:9092
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-AC_placeholder}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-placeholder_token}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-+10000000000}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - iers-network

# ─────────────────────── VOLUMES & NETWORK ───────────────────────

volumes:
  postgres-data:
  redis-data:
  kafka-data:

networks:
  iers-network:
    driver: bridge
