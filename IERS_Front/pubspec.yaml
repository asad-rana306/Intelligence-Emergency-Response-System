name: iers_app
description: IERS - Intelligent Emergency Response System (driver + responder app)
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

# Versions below are the ones this code was checked against (Flutter 3.47.4, Oct 2026).
dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.5

  # Network
  http: ^1.5.0
  http_parser: ^4.1.2
  stomp_dart_client: ^3.0.1
  connectivity_plus: ^7.3.2

  # Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.6

  # Location, sensors, map (OpenStreetMap: no API key needed)
  geolocator: ^14.1.2
  sensors_plus: ^7.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.0

  # Calls, voice notes, alarm
  flutter_webrtc: ^1.6.3
  record: ^7.1.1
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  vibration: ^3.2.1
  wakelock_plus: ^1.8.2
  volume_controller: ^3.3.3

  # Phone features
  url_launcher: ^6.3.3
  flutter_phone_direct_caller: ^2.2.1
  permission_handler: ^12.0.3
  battery_plus: ^7.1.2

  # Push, notifications, background work (added for the new backend)
  # NOTE: these versions could not be checked against pub.dev when this file was written.
  # If `flutter pub get` complains, run `flutter pub upgrade --major-versions <package>`.
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.0
  flutter_foreground_task: ^9.1.0
  # 19.x on purpose: 20.x changed the method signatures (named parameters).
  flutter_local_notifications: ^19.4.0
  flutter_contacts: ^1.1.9

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Overrides transitive Linux desktop plugin conflict between battery_plus and wakelock_plus
dependency_overrides:
  dbus: ^0.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/