spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

dispatch:
  kafka:
    topic: crash-events-test
    group-id: dispatch-group-test
  twilio:
    enabled: false
  tracking-base-url: http://localhost:3000/track

eureka:
  client:
    enabled: false
