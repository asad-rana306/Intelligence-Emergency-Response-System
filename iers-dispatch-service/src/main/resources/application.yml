# ═══════════════════════════════════════════════════════════════
#  IERS Dispatch & Notification Service — Configuration
# ═══════════════════════════════════════════════════════════════
#  ENVIRONMENT VARIABLES:
#    DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
#    DDL_AUTO                 — update (default) | validate | create-drop (tests only)
#    REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
#    KAFKA_BOOTSTRAP
#    EUREKA_URL
#    SMS_PROVIDER             — log (default, only prints) | simgate (real SMS)
#    SIMGATE_API_KEY / SIMGATE_DEVICE_ID   — needed when SMS_PROVIDER=simgate
#    GOOGLE_APPLICATION_CREDENTIALS        — path of the Firebase service-account JSON
#    FIREBASE_PROJECT_ID                   — e.g. iers-a6400
#    FCM_ENABLED              — true (default) | false
#    TRACKING_BASE_URL        — page contacts open to follow the ambulance
#    EMERGENCY_NUMBER         — national number printed in SMS (default 1122)
#    DUTY_LISTENER_ENABLED    — true (default) | false = do not read Auth duty-events
# ═══════════════════════════════════════════════════════════════

server:
  port: 8083

spring:
  application:
    name: dispatch-notification-service

  # ── PostgreSQL + PostGIS ──
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iers_dispatch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:<YOUR_DB_PASSWORD>}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # "update" keeps the data when the service restarts (the sweep needs it to resume
      # offers and contact alerts). The old value "create" erased every incident on restart.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis (GPS streaming cache) ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # ── Kafka ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: dispatch-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ── Feign (calls to Auth) ──
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000     # ms — Auth is on the same network, it answers fast or not at all
            read-timeout: 4000        # ms — must stay below the circuit-breaker time limit below

# ── Dispatch ──
dispatch:
  kafka:
    topic: crash-events               # crashes from the IoT service
    group-id: dispatch-group
    incident-topic: incident-events   # what Dispatch announces
    duty-topic: duty-events           # what Auth announces (shift over / phone silent)
    duty-listener-enabled: ${DUTY_LISTENER_ENABLED:true}   # false = do not read duty-events

  # ── Contact alerts (SMS to emergency contacts) ──
  notify:
    tracking-base-url: ${TRACKING_BASE_URL:http://localhost:3000/track}
    emergency-number: ${EMERGENCY_NUMBER:1122}
    contact-retry-interval: 20s       # wait before the next try when an SMS failed
    contact-lease: 2m                 # one worker owns an alert this long (many instances)
    give-up-after: 30m                # stop retrying an alert for an incident this old
    batch-size: 20                    # alerts picked up per sweep
    executor:
      threads: 4                      # background workers for SMS and push
      queue-capacity: 500

  # ── SMS provider ──
  sms:
    provider: ${SMS_PROVIDER:log}     # log | simgate
    simgate:
      base-url: https://api.simgate.app
      api-key: ${SIMGATE_API_KEY:}
      device-id: ${SIMGATE_DEVICE_ID:}
      connect-timeout: 3s
      read-timeout: 10s
      max-attempts: 2

  # ── Push (Firebase Cloud Messaging) ──
  fcm:
    enabled: ${FCM_ENABLED:true}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    project-id: ${FIREBASE_PROJECT_ID:}
    offer-ttl: 30s                    # an ambulance offer is useless after the offer time

# ── Eureka ──
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

# ── Resilience4j (Feign circuit breakers) ──
# "default" applies to every Feign method. (Per-method names are generated, so a named
# instance would never match.)
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 6s

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# ── Logging ──
logging:
  level:
    root: INFO
    com.iers.dispatch: DEBUG
    org.apache.kafka: WARN
