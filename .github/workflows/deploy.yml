name: Deploy IERS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SIMGATE_API_KEY: ${{ secrets.SIMGATE_API_KEY }}
          SIMGATE_DEVICE_ID: ${{ secrets.SIMGATE_DEVICE_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          envs: SIMGATE_API_KEY,SIMGATE_DEVICE_ID,FIREBASE_PROJECT_ID,FIREBASE_SERVICE_ACCOUNT
          script: |
            set -e
            cd ~/iers

            # 1. Reclaim ownership of ~/iers/secrets, remove accidental directory, and write Firebase JSON
            sudo mkdir -p ~/iers/secrets
            sudo chown -R "$(whoami):$(whoami)" ~/iers/secrets
            chmod 755 ~/iers/secrets
            rm -rf ~/iers/secrets/firebase-service-account.json
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" > ~/iers/secrets/firebase-service-account.json
            chmod 644 ~/iers/secrets/firebase-service-account.json

            # 2. Update SimGate & Firebase variables in ~/iers/.env without erasing existing keys
            touch ~/iers/.env
            grep -vE '^(SMS_PROVIDER|SIMGATE_API_KEY|SIMGATE_DEVICE_ID|FIREBASE_PROJECT_ID)=' ~/iers/.env > ~/iers/.env.tmp || true
            {
              cat ~/iers/.env.tmp
              echo "SMS_PROVIDER=simgate"
              echo "SIMGATE_API_KEY=$SIMGATE_API_KEY"
              echo "SIMGATE_DEVICE_ID=$SIMGATE_DEVICE_ID"
              echo "FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-iers-a6400}"
            } > ~/iers/.env
            rm -f ~/iers/.env.tmp

            # 3. Pull latest code and rebuild containers
            git pull origin main
            docker compose up -d --build
            docker image prune -f